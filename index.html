<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobulum Games</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a1a;
        color: #e0e0e0;
        font-family: 'Segoe UI', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      header {
        padding: 3rem 1rem 2rem;
        text-align: center;
      }
      header h1 {
        font-size: 2.5rem;
        color: #fff;
        letter-spacing: 0.05em;
      }
      header p {
        margin-top: 0.5rem;
        color: #888;
        font-size: 1.1rem;
      }
      .games-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
        padding: 2rem;
        max-width: 1200px;
        width: 100%;
      }
      .game-card {
        background: #16162a;
        border: 1px solid #2a2a4a;
        border-radius: 12px;
        padding: 1.5rem;
        transition: transform 0.2s, border-color 0.2s;
        text-decoration: none;
        color: inherit;
        display: block;
      }
      .game-card:hover {
        transform: translateY(-4px);
        border-color: #4a4a8a;
      }
      .game-card h2 {
        font-size: 1.3rem;
        color: #fff;
        margin-bottom: 0.5rem;
      }
      .game-card .url {
        font-size: 0.85rem;
        color: #6a6aaa;
        font-family: monospace;
      }
      .empty {
        color: #555;
        text-align: center;
        padding: 4rem;
        font-size: 1.2rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Mobulum Games</h1>
      <p>Browser games collection</p>
    </header>
    <div class="games-grid" id="games"></div>
    <script>
      // AUTO-GENERATED: Do not edit manually. Updated by scripts/create-project.sh
      const games = [
        // GAMES_LIST_START
        {
          name: "Kółko i Krzyżyk",
          url: "/kolko-i-krzyzyk/",
          description: "Klasyczna gra w kółko i krzyżyk z animacjami i licznikiem punktów"
        },
        {
          name: "Wyprawa Bohatera: Minecraft World & Lochy 2D",
          url: "/minecraft-lochy/",
          description: "RPG 2D z budowaniem, wydobywaniem surowców i eksploracją lochów"
        },
        {
          name: "Podbój Świata - Grand Strategy 1756",
          url: "/podboj-swiata/",
          description: "Strategia globalna w realiach wojny siedmioletniej"
        },
        {
          name: "Królestwo Cieni - Otwarta Mapa & Wioska 3D",
          url: "/krolestwo-cieni/",
          description: "Gra przygodowa z otwartym światem i osadą 3D"
        },
        {
          name: "Ewolucja Człowieka: Epoki & Kontynenty",
          url: "/ewolucja-czlowieka/",
          description: "Symulacja rozwoju cywilizacji przez epoki i kontynenty"
        },
        {
          name: "Pixel Dungeon Deckbuilder",
          url: "/pixel-dungeon/",
          description: "Roguelike karciany z budowaniem talii w lochach retro"
        },
        {
          name: "Ewolucja Cywilizacji - Wojna, Armie & Tech Tree",
          url: "/ewolucja-cywilizacji/",
          description: "Rozbudowa państwa, drzewo technologii oraz bitwy armii"
        },
        {
          name: "Chronicles of Magitech - Mega Expansion RPG",
          url: "/chronicles-of-magitech/",
          description: "Rozbudowane RPG łączące magię z technologią"
        }
        // GAMES_LIST_END
      ];
      const grid = document.getElementById("games");
      if (games.length === 0) {
        grid.innerHTML = '<div class="empty">No games yet. Create one with <code>scripts/create-project.sh</code></div>';
      } else {
        games.forEach(g => {
          const a = document.createElement("a");
          a.className = "game-card";
          a.href = g.url;
          a.innerHTML = `<h2>${g.name}</h2><p style="color:#aaa;font-size:0.9rem;margin-bottom:0.75rem;">${g.description || ''}</p><div class="url">games.mobulum.com${g.url}</div>`;
          grid.appendChild(a);
        });
      }
    </script>
  </body>
</html>
